<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA 3026</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#00ff00">
<style>
*{box-sizing:border-box} body{margin:0;background:#000;color:#0f0;font-family:monospace;min-height:100vh}
.header{padding:15px;border-bottom:1px solid #0f0;display:flex;justify-content:space-between;align-items:center}
.badge{background:#0f0;color:#000;padding:3px 8px;border-radius:10px;font-size:11px}
.card{border:1px solid #0f0;margin:12px;padding:14px;border-radius:12px;background:#0a0a0a}
input,button{width:100%;padding:12px;border-radius:8px;border:1px solid #0f0;margin:6px 0;font-size:15px}
input{background:#111;color:#0f0} button{background:#0f0;color:#000;font-weight:900;cursor:pointer}
.msg{padding:10px;margin:8px 0;border-radius:8px;white-space:pre-wrap;line-height:1.5}
.user{background:#0f0;color:#000;margin-left:30px} .nova{background:#111;border:1px solid #0f0;margin-right:30px}
#chat{max-height:55vh;overflow:auto} .small{font-size:11px;opacity:.7}
</style>
</head>
<body>
<div class="header"><b>🚀 NOVA 3026</b><span class="badge">meshmashOK: true</span></div>
<div class="card"><div><b>Phase:</b> NOVA 3026 FINAL COMPLETE</div><div class="small">standalone PWA - no server needed - ولا يا مشمش مرة واحدة بس</div><div class="small" id="status">✅ Online - PWA Ready</div></div>

<div class="card">
<div id="chat"></div>
<input id="q" placeholder="اسأل نوفا... مثلا: انت مين؟ ولا يا مشمش؟">
<button onclick="ask()">اسأل NOVA</button>
<button onclick="clearChat()" style="background:#111;color:#0f0">مسح الشات</button>
</div>

<script>
// NOVA LOGIC - standalone, no /api/ask needed
function novaReply(q){
  const l=q.toLowerCase();
  if(l.includes("مشمش")||l.includes("meshmash")) return "ولا يا مشمش مرة واحدة بس 😂
NOVA 3026 شغال 100%
meshmashCount: 1
meshmashOK: true";
  if(l.includes("status")||l.includes("حال")) return "NOVA 3026 FINAL COMPLETE ✅
- Mode: PWA Standalone
- Server: Not needed
- Node: v26.3.1 (old)
- PWA: v1 - offline ready
- Time: "+new Date().toLocaleString('ar-EG');
  if(l.includes("مين")||l.includes("who")||l.includes("انت")) return "أنا NOVA 3026 🤖
مساعد Mi Na
شغال كـ PWA على موبايلك
مش محتاج Termux ولا سيرفر
تقدر تثبتني كأبلكيشن من المتصفح";
  if(l.includes("pm2")||l.includes("سيرفر")) return "السيرفر القديم كان على 127.0.0.1:3000
دلوقتي انت PWA Standalone
لو عايز السيرفر: pm2 list
لو عايز PWA: انت شغال فيه دلوقتي!";
  if(l.includes("apk")||l.includes("ابلكيشن")) return "الخطوة الجاية: APK
1- PWA شغال دلوقتي ✅
2- هنحوله APK بـ Capacitor
3- هيطلع ملف NOVA-3026.apk تثبته";
  return "NOVA 3026 رد:
""+q+""

وصلني! أنا شغال Offline كـ PWA.
جرب تقول: ولا يا مشمش، انت مين، status";
}
function addMsg(text, cls){
  const chat=document.getElementById('chat');
  const d=document.createElement('div');
  d.className='msg '+cls;
  d.textContent=text;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
  localStorage.setItem('nova_chat', chat.innerHTML);
}
function ask(){
  const input=document.getElementById('q');
  const q=input.value.trim(); if(!q) return;
  addMsg(q,'user');
  input.value='';
  setTimeout(()=>{ addMsg(novaReply(q),'nova'); }, 300);
}
function clearChat(){ document.getElementById('chat').innerHTML=''; localStorage.removeItem('nova_chat'); }
document.getElementById('q').addEventListener('keydown',e=>{ if(e.key==='Enter') ask(); });
window.onload=()=>{
  const saved=localStorage.getItem('nova_chat');
  if(saved) document.getElementById('chat').innerHTML=saved;
  else addMsg("أهلا! أنا NOVA 3026 FINAL COMPLETE 🚀
اكتب أي حاجة وجرب تقول: ولا يا مشمش","nova");
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js'); }
};
</script>
</body>
</html>
